name: build
on:
   push:
      branches:
      - main
   pull_request:
permissions:
   contents: write
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
      -  name: Checkout
         uses: actions/checkout@v7
      -  name: Set up JDK
         uses: actions/setup-java@v6
         with:
            distribution: temurin
            java-version: 21
      -  name: Setup Maven
         uses: stCarolas/setup-maven@v5
         with:
           maven-version: 3.9.16
      -  name: Set up cache
         uses: actions/cache@v6.1.0
         with:
           path: ~/.m2/repository
           key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           restore-keys: |
             ${{ runner.os }}-maven-
      -  name: Build
         # The end-to-end tests drive a real workbench with SWTBot: they need a display.
         run: |
            set -o pipefail
            xvfb-run -a mvn -B clean install 2>&1 | tee build.log
      -  name: Report the failure
         # The failure as annotations of the run: readable with the REST API of GitHub.
         if: failure()
         run: |
            annotate() { python3 -c 'import sys,urllib.parse; d=sys.stdin.read()[-60000:]; print("::error title='"$1"'::" + d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
            grep -E "\[ERROR\]|Tests run:|FAIL" build.log | head -150 | annotate "Maven errors"
            for f in tests/*/target/surefire-reports/*.txt; do [ -f "$f" ] && cat "$f" | annotate "$(basename $f)"; done
            for f in tests/*/target/work/data/.metadata/.log; do [ -f "$f" ] && tail -c 50000 "$f" | annotate "Eclipse log"; done
            true
      -  name: Upload the test reports
         if: failure()
         uses: actions/upload-artifact@v7
         with:
            name: test-reports
            path: |
               tests/*/target/surefire-reports
               tests/*/target/screenshots
               tests/*/target/work/data/.metadata/.log
      -  name: Release
         if: github.event_name == 'push'
         env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest --prerelease --title "Development Build" --target "$GITHUB_SHA" \
               --notes "Latest build of the main branch." \
               update-site/org.eclipse.txray/target/org.eclipse.txray.updatesite-*-SNAPSHOT.zip
      -  name: Publish p2 update site
         if: github.event_name == 'push'
         env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
            if ! git clone --depth 1 --branch update-site "$remote" site; then
               mkdir site
               git -C site init -b update-site
               git -C site remote add origin "$remote"
            fi
            rm -rf site/latest
            mkdir -p site/latest
            cp -r update-site/org.eclipse.txray/target/repository/* site/latest/
            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "New version of the update site"
            git push origin update-site
